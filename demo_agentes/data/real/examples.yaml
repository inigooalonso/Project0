# Preguntas de ejemplo: un botón por pregunta en la página de ADA.
#
# Solo necesitas la pregunta: tu agente genera el pseudocódigo, la SQL y el
# resultado en tiempo de ejecución contra Athena.
#
# Campos: question (obligatorio), label (texto del botón; si falta, la
# pregunta), icon (opcional, iconos Material: https://fonts.google.com/icons)
# e id (opcional).
#
# Los cambios en este fichero se aplican al recargar la página.

examples:
  - label: Negocio por mesa de Global Markets
    icon: ":material/trending_up:"
    question: ¿Qué mesa de Global Markets ha generado más negocio en la Franquicia de Distribución en 2026?
  # - label: Otra pregunta
  #   icon: ":material/query_stats:"
  #   question: ¿...?
