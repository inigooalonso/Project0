# Reglas de join DEFINIDAS A MANO para el catálogo simulado.
#
# El paso «Joins y glosario» busca aquí el camino que conecta las tablas
# encontradas por el RAG. Si hace falta una tabla intermedia, la añade como
# «tabla puente». Formato de cada regla:
#   left / right: tabla y campo de cada extremo (base.tabla.campo)
#   type: tipo de join recomendado
#   cardinality: relación entre left y right
#   description: significado de negocio de la relación

joins:
  - left: ho_master.t_prsg_loans.gf_branch_id
    right: ho_master.t_pred_branches.gf_branch_id
    type: INNER
    cardinality: "N:1"
    description: Cada préstamo pertenece a la oficina que lo formalizó.

  - left: ho_master.t_prsg_loan_delinquency.gf_loan_id
    right: ho_master.t_prsg_loans.gf_loan_id
    type: INNER
    cardinality: "N:1"
    description: Cada fila de impagos es la foto mensual de un préstamo.

  - left: ho_master.t_prsg_loans.gf_customer_id
    right: ho_master.t_pcli_customers.gf_customer_id
    type: INNER
    cardinality: "N:1"
    description: Cada préstamo tiene un cliente titular.

  - left: ho_master.t_pcta_account_balances_monthly.gf_account_id
    right: ho_master.t_pcta_accounts.gf_account_id
    type: INNER
    cardinality: "N:1"
    description: Cada saldo mensual corresponde a una cuenta.

  - left: ho_master.t_pcta_account_movements.gf_account_id
    right: ho_master.t_pcta_accounts.gf_account_id
    type: INNER
    cardinality: "N:1"
    description: Cada movimiento se registra en una cuenta.

  - left: ho_master.t_pcta_accounts.gf_customer_id
    right: ho_master.t_pcli_customers.gf_customer_id
    type: INNER
    cardinality: "N:1"
    description: Cada cuenta tiene un cliente titular principal.

  - left: ho_master.t_pcta_accounts.gf_branch_id
    right: ho_master.t_pred_branches.gf_branch_id
    type: INNER
    cardinality: "N:1"
    description: Cada cuenta está domiciliada en una oficina.

  - left: ho_master.t_pmpg_card_transactions.gf_card_id
    right: ho_master.t_pmpg_cards.gf_card_id
    type: INNER
    cardinality: "N:1"
    description: Cada compra se realiza con una tarjeta.

  - left: ho_master.t_pmpg_cards.gf_account_id
    right: ho_master.t_pcta_accounts.gf_account_id
    type: INNER
    cardinality: "N:1"
    description: Cada tarjeta liquida sus operaciones en una cuenta.

  - left: ho_master.t_pmpg_cards.gf_customer_id
    right: ho_master.t_pcli_customers.gf_customer_id
    type: INNER
    cardinality: "N:1"
    description: Cada tarjeta tiene un cliente titular.

  - left: ho_master.t_pcli_customers.gf_branch_id
    right: ho_master.t_pred_branches.gf_branch_id
    type: INNER
    cardinality: "N:1"
    description: Cada cliente tiene una oficina gestora.
