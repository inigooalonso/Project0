# Catálogo de datos SIMULADO (dominio de banca minorista).
#
# Jerarquía que recorre el RAG multinivel: propietario → tabla → campo.
# - propietario: dominio de datos con su UUAA (código de 4 caracteres que
#   aparece en el nombre físico de la tabla: t_{uuaa}_{nombre}).
# - keywords: sinónimos de negocio que usa el buscador simulado.
# - values: valores reales de los campos categóricos; se envían al LLM para que
#   use los literales correctos en los filtros.
#
# Las tablas de la base DuckDB simulada se generan a partir de este fichero
# (data/synthetic.py) y un test comprueba que coinciden campo a campo.

database: ho_master

owners:
  - code: pred
    name: Red Comercial
    business_owner: Dirección de Red Comercial
    description: Estructura de la red de oficinas, direcciones territoriales y su ubicación geográfica.
    keywords: [oficina, oficinas, sucursal, red comercial, territorial, dirección territorial, zona, región, provincia, municipio]
    tables:
      - name: t_pred_branches
        label: Maestro de oficinas
        description: Registra las oficinas de la red comercial con su dirección territorial, provincia y tipología. Una fila por oficina. Se integra por gf_branch_id con clientes, cuentas y préstamos.
        keywords: [oficina, oficinas, sucursal, red, maestro de oficinas, territorial]
        fields:
          - name: gf_branch_id
            label: identificador oficina
            description: Código de cuatro dígitos que identifica la oficina.
            type: string
            role: key
            keywords: [oficina, código de oficina, sucursal]
          - name: gf_branch_name
            label: nombre oficina
            description: Nombre comercial de la oficina (municipio · zona).
            type: string
            keywords: [oficina, nombre de la oficina, sucursal]
          - name: gf_branch_type_desc
            label: tipo oficina
            description: Tipología de la oficina según su modelo de atención.
            type: string
            values: [Urbana, Comarcal, Empresas]
            keywords: [tipo de oficina, tipología]
          - name: gf_city_name
            label: municipio oficina
            description: Municipio donde está ubicada la oficina.
            type: string
            keywords: [municipio, ciudad, localidad]
          - name: gf_province_name
            label: provincia oficina
            description: Provincia donde está ubicada la oficina.
            type: string
            keywords: [provincia]
          - name: gf_region_name
            label: dirección territorial
            description: Dirección territorial a la que reporta la oficina.
            type: string
            values: [Centro, Cataluña, Este, Sur, Norte, Noroeste, Canarias]
            keywords: [territorial, dirección territorial, región, zona]
          - name: gf_opening_date
            label: fecha apertura oficina
            description: Fecha de apertura de la oficina.
            type: date
            keywords: [apertura, inauguración]

  - code: pcli
    name: Clientes
    business_owner: Dirección de Clientes
    description: Datos maestros de los clientes particulares y empresas, su segmento comercial y su captación.
    keywords: [cliente, clientes, titular, persona, empresa, segmento, captación, alta de clientes, particulares]
    tables:
      - name: t_pcli_customers
        label: Maestro de clientes
        description: Registra cada cliente con su segmento comercial, tipo de persona, oficina gestora y fecha y canal de alta. Una fila por cliente.
        keywords: [cliente, clientes, titular, maestro de clientes, segmento, captación]
        fields:
          - name: gf_customer_id
            label: identificador cliente
            description: Código que identifica de forma única al cliente.
            type: string
            role: key
            keywords: [cliente, código de cliente, titular]
          - name: gf_customer_type_desc
            label: tipo persona
            description: Indica si el cliente es persona física o persona jurídica.
            type: string
            values: [Persona física, Persona jurídica]
            keywords: [tipo de persona, persona física, persona jurídica]
          - name: gf_customer_segment_desc
            label: segmento cliente
            description: Segmento comercial al que pertenece el cliente.
            type: string
            values: [Particulares, Banca Personal, Pymes, Empresas]
            keywords: [segmento, segmento de cliente, particulares, pymes, empresas, banca personal]
          - name: gf_age_band_desc
            label: tramo edad
            description: Tramo de edad del cliente persona física; «No aplica» para personas jurídicas.
            type: string
            values: [18-29, 30-44, 45-64, 65 o más, No aplica]
            keywords: [edad, tramo de edad, jóvenes, mayores]
          - name: gf_customer_entry_date
            label: fecha alta cliente
            description: Fecha en la que el cliente se dio de alta en el banco.
            type: date
            keywords: [alta, fecha de alta, captación, clientes nuevos, nuevos clientes]
          - name: gf_acquisition_channel_desc
            label: canal captación
            description: Canal por el que se captó al cliente.
            type: string
            values: [Oficina, Digital, Agente colaborador]
            keywords: [canal, canal de captación, digital, captación]
          - name: gf_branch_id
            label: oficina gestora
            description: Oficina que gestiona la relación con el cliente.
            type: string
            role: key
            keywords: [oficina gestora, oficina]
          - name: gf_province_name
            label: provincia residencia
            description: Provincia de residencia del cliente.
            type: string
            keywords: [provincia, residencia]

  - code: pcta
    name: Cuentas y Depósitos
    business_owner: Dirección de Recursos de Clientes
    description: Contratos de cuentas a la vista, cuentas de ahorro y depósitos, con sus saldos mensuales y sus movimientos.
    keywords: [cuenta, cuentas, depósito, depósitos, saldo, saldos, recursos, ahorro, cuenta a la vista, cuenta corriente, movimientos]
    tables:
      - name: t_pcta_accounts
        label: Contratos de cuenta
        description: Registra cada contrato de cuenta o depósito con su titular, oficina, tipo de producto y fechas de apertura y cancelación. Una fila por cuenta.
        keywords: [cuenta, cuentas, contrato de cuenta, depósito, producto de pasivo, cuenta a la vista]
        fields:
          - name: gf_account_id
            label: identificador cuenta
            description: Código que identifica el contrato de cuenta.
            type: string
            role: key
            keywords: [cuenta, número de cuenta, contrato]
          - name: gf_customer_id
            label: identificador titular
            description: Cliente titular principal de la cuenta.
            type: string
            role: key
            keywords: [titular, cliente]
          - name: gf_branch_id
            label: oficina cuenta
            description: Oficina en la que está domiciliada la cuenta.
            type: string
            role: key
            keywords: [oficina]
          - name: gf_product_type_desc
            label: tipo producto cuenta
            description: Tipo de producto de pasivo contratado.
            type: string
            values: [Cuenta a la vista, Cuenta de ahorro, Depósito a plazo]
            keywords: [tipo de producto, cuenta a la vista, cuenta corriente, ahorro, depósito a plazo]
          - name: gf_opening_date
            label: fecha apertura cuenta
            description: Fecha de apertura del contrato.
            type: date
            keywords: [apertura, fecha de apertura]
          - name: gf_cancellation_date
            label: fecha cancelación cuenta
            description: Fecha de cancelación del contrato; vacía si la cuenta sigue activa.
            type: date
            keywords: [cancelación, baja, cierre de cuenta]
          - name: gf_currency_id
            label: divisa cuenta
            description: Código ISO de la divisa de la cuenta.
            type: string
            values: [EUR]
            keywords: [divisa, moneda]

      - name: t_pcta_account_balances_monthly
        label: Saldos mensuales de cuentas
        description: Registra el saldo de cada cuenta al cierre de cada mes y su saldo medio mensual. Una fila por cuenta y mes. Se integra por gf_account_id con t_pcta_accounts.
        keywords: [saldo, saldos, saldo mensual, cierre de mes, evolución de saldo, recursos]
        fields:
          - name: gf_account_id
            label: identificador cuenta
            description: Código que identifica el contrato de cuenta.
            type: string
            role: key
            keywords: [cuenta]
          - name: gf_cutoff_date
            label: fecha corte saldo
            description: Último día natural del mes al que se refiere el saldo.
            type: date
            keywords: [fecha de corte, mes, cierre de mes, periodo]
          - name: gf_end_month_balance_amount
            label: saldo fin de mes
            description: Saldo contable de la cuenta al cierre del mes, en euros.
            type: decimal
            keywords: [saldo, saldo a fin de mes, saldo de cierre, saldo contable]
          - name: gf_avg_month_balance_amount
            label: saldo medio mensual
            description: Saldo medio diario de la cuenta durante el mes, en euros.
            type: decimal
            keywords: [saldo medio, saldo promedio]

      - name: t_pcta_account_movements
        label: Movimientos de cuenta
        description: Registra los cargos y abonos de las cuentas a la vista con su concepto y canal. Una fila por movimiento.
        keywords: [movimiento, movimientos, cargo, abono, transferencia, recibo, bizum, nómina, operaciones de cuenta]
        fields:
          - name: gf_movement_id
            label: identificador movimiento
            description: Código que identifica el movimiento.
            type: string
            role: key
            keywords: [movimiento]
          - name: gf_account_id
            label: identificador cuenta
            description: Cuenta en la que se registra el movimiento.
            type: string
            role: key
            keywords: [cuenta]
          - name: gf_operation_date
            label: fecha operación movimiento
            description: Fecha en la que se realiza el movimiento.
            type: date
            keywords: [fecha de operación, fecha del movimiento]
          - name: gf_movement_amount
            label: importe movimiento
            description: Importe del movimiento en euros; positivo en abonos y negativo en cargos.
            type: decimal
            keywords: [importe del movimiento, cargo, abono]
          - name: gf_movement_type_desc
            label: tipo movimiento
            description: Indica si el movimiento es un abono o un cargo.
            type: string
            values: [Abono, Cargo]
            keywords: [tipo de movimiento, cargo, abono]
          - name: gf_movement_category_desc
            label: concepto movimiento
            description: Concepto de negocio del movimiento.
            type: string
            values: [Nómina, Transferencia emitida, Transferencia recibida, Bizum, Recibo domiciliado, Retirada de efectivo, Ingreso en efectivo, Impuestos, Comisión]
            keywords: [concepto, transferencia, bizum, recibo, nómina, efectivo]
          - name: gf_channel_desc
            label: canal movimiento
            description: Canal por el que se origina el movimiento.
            type: string
            values: [App, Web, Oficina, Cajero]
            keywords: [canal, app, web, cajero]

  - code: pmpg
    name: Medios de Pago
    business_owner: Dirección de Medios de Pago
    description: Tarjetas de débito y crédito y las compras realizadas con ellas en comercios.
    keywords: [tarjeta, tarjetas, compra, compras, gasto, pago con tarjeta, comercio, medios de pago, crédito, débito]
    tables:
      - name: t_pmpg_cards
        label: Contratos de tarjeta
        description: Registra cada tarjeta emitida con su tipo (débito o crédito), marca, titular, cuenta asociada y estado. Una fila por tarjeta.
        keywords: [tarjeta, tarjetas, tarjeta de crédito, tarjeta de débito, contrato de tarjeta]
        fields:
          - name: gf_card_id
            label: identificador tarjeta
            description: Código que identifica la tarjeta.
            type: string
            role: key
            keywords: [tarjeta]
          - name: gf_customer_id
            label: identificador titular tarjeta
            description: Cliente titular de la tarjeta.
            type: string
            role: key
            keywords: [titular, cliente]
          - name: gf_account_id
            label: cuenta asociada
            description: Cuenta en la que se liquidan las operaciones de la tarjeta.
            type: string
            role: key
            keywords: [cuenta asociada, cuenta]
          - name: gf_card_type_desc
            label: tipo tarjeta
            description: Modalidad de la tarjeta.
            type: string
            values: [Débito, Crédito]
            keywords: [tipo de tarjeta, crédito, débito]
          - name: gf_card_brand_desc
            label: marca tarjeta
            description: Marca de la red de pagos.
            type: string
            values: [Visa, Mastercard]
            keywords: [marca, visa, mastercard]
          - name: gf_issue_date
            label: fecha emisión tarjeta
            description: Fecha de emisión de la tarjeta.
            type: date
            keywords: [emisión, alta de tarjeta]
          - name: gf_card_status_desc
            label: estado tarjeta
            description: Situación actual de la tarjeta.
            type: string
            values: [Activa, Bloqueada, Cancelada]
            keywords: [estado, activa, bloqueada]

      - name: t_pmpg_card_transactions
        label: Operaciones con tarjeta
        description: Registra cada compra realizada con tarjeta en comercios, con su importe, categoría de comercio (MCC), canal y país. Una fila por operación. Se integra por gf_card_id con t_pmpg_cards.
        keywords: [compra con tarjeta, compras, gasto con tarjeta, operación con tarjeta, pago con tarjeta, comercio, gasto]
        fields:
          - name: gf_card_txn_id
            label: identificador operación tarjeta
            description: Código que identifica la operación.
            type: string
            role: key
            keywords: [operación]
          - name: gf_card_id
            label: identificador tarjeta
            description: Tarjeta con la que se realiza la operación.
            type: string
            role: key
            keywords: [tarjeta]
          - name: gf_operation_date
            label: fecha operación tarjeta
            description: Fecha en la que se realiza la compra.
            type: date
            keywords: [fecha de la operación, fecha de compra]
          - name: gf_txn_amount
            label: importe operación tarjeta
            description: Importe de la compra con tarjeta, en euros.
            type: decimal
            keywords: [importe de la compra, gasto, importe, compra]
          - name: gf_merchant_category_id
            label: código MCC
            description: Código de categoría de comercio (Merchant Category Code).
            type: string
            keywords: [mcc, código de comercio]
          - name: gf_merchant_category_desc
            label: categoría comercio
            description: Categoría de negocio del comercio donde se realiza la compra.
            type: string
            values: [Alimentación, Restauración, Viajes y alojamiento, Combustible, Moda, Ocio y cultura, Salud y farmacia, Hogar y bricolaje, Tecnología, Transporte]
            keywords: [categoría de comercio, sector, tipo de comercio, comercio]
          - name: gf_channel_desc
            label: canal compra
            description: Indica si la compra es presencial u online.
            type: string
            values: [Presencial, Online]
            keywords: [canal, online, presencial, comercio electrónico]
          - name: gf_country_id
            label: país comercio
            description: Código ISO del país del comercio.
            type: string
            keywords: [país, extranjero]

  - code: prsg
    name: Riesgos de Crédito
    business_owner: Dirección de Riesgos
    description: Contratos de préstamo e hipoteca, su concesión y la situación mensual de impagos y morosidad.
    keywords: [préstamo, préstamos, hipoteca, hipotecas, crédito, financiación, riesgo, morosidad, mora, impagos, concesión]
    tables:
      - name: t_prsg_loans
        label: Contratos de préstamo
        description: Registra cada préstamo o hipoteca formalizado con su producto, importe concedido, saldo vivo, tipo de interés, plazo, cliente y oficina formalizadora. Una fila por préstamo.
        keywords: [préstamo, préstamos, hipoteca, hipotecas, préstamo hipotecario, concesión, formalización, financiación]
        fields:
          - name: gf_loan_id
            label: identificador préstamo
            description: Código que identifica el contrato de préstamo.
            type: string
            role: key
            keywords: [préstamo, contrato]
          - name: gf_customer_id
            label: identificador cliente préstamo
            description: Cliente titular del préstamo.
            type: string
            role: key
            keywords: [titular, cliente]
          - name: gf_branch_id
            label: oficina formalizadora
            description: Oficina que formalizó el préstamo.
            type: string
            role: key
            keywords: [oficina formalizadora, oficina]
          - name: gf_loan_product_desc
            label: producto préstamo
            description: Producto de financiación contratado.
            type: string
            values: [Hipoteca vivienda, Préstamo consumo, Préstamo vehículo, Préstamo empresa]
            keywords: [producto, tipo de préstamo, tipo de producto, hipoteca, consumo]
          - name: gf_formalization_date
            label: fecha formalización
            description: Fecha de firma y concesión del préstamo.
            type: date
            keywords: [fecha de formalización, fecha de concesión, firma]
          - name: gf_granted_amount
            label: importe concedido
            description: Principal concedido en la formalización, en euros.
            type: decimal
            keywords: [importe concedido, importe formalizado, concesión, nueva producción, principal]
          - name: gf_outstanding_amount
            label: saldo vivo préstamo
            description: Capital pendiente de amortizar al último cierre, en euros.
            type: decimal
            keywords: [saldo vivo, capital pendiente, riesgo vivo]
          - name: gf_interest_rate_per
            label: tipo interés
            description: Tipo de interés nominal anual, en porcentaje.
            type: decimal
            keywords: [tipo de interés, interés, tin]
          - name: gf_term_months_number
            label: plazo meses
            description: Plazo total del préstamo, en meses.
            type: integer
            keywords: [plazo, duración]
          - name: gf_loan_status_desc
            label: estado préstamo
            description: Situación del contrato al último cierre.
            type: string
            values: [Vivo, Amortizado]
            keywords: [estado, vivo, amortizado]

      - name: t_prsg_loan_delinquency
        label: Situación mensual de impagos
        description: Registra al cierre de cada mes el saldo vivo de cada préstamo, los días de impago y las cuotas impagadas. Base del cálculo de la morosidad. Una fila por préstamo y mes. Se integra por gf_loan_id con t_prsg_loans.
        keywords: [morosidad, mora, impago, impagos, impagados, recibos impagados, dudoso, situación de impago]
        fields:
          - name: gf_loan_id
            label: identificador préstamo
            description: Código que identifica el contrato de préstamo.
            type: string
            role: key
            keywords: [préstamo]
          - name: gf_cutoff_date
            label: fecha corte impagos
            description: Último día natural del mes al que se refiere la situación.
            type: date
            keywords: [fecha de corte, cierre de mes, fecha de referencia]
          - name: gf_outstanding_amount
            label: saldo vivo corte
            description: Capital pendiente del préstamo a la fecha de corte, en euros.
            type: decimal
            keywords: [saldo vivo, capital pendiente, riesgo vivo]
          - name: gf_days_past_due_number
            label: días impago
            description: Días transcurridos desde la cuota impagada más antigua; 0 si el préstamo está al corriente.
            type: integer
            keywords: [días de impago, morosidad, mora, dudoso, más de 90 días]
          - name: gf_unpaid_installments_number
            label: cuotas impagadas
            description: Número de cuotas vencidas y no pagadas a la fecha de corte.
            type: integer
            keywords: [cuotas impagadas, recibos impagados, impagados, morosidad, impago]
          - name: gf_unpaid_amount
            label: importe impagado
            description: Suma de las cuotas vencidas y no pagadas a la fecha de corte, en euros.
            type: decimal
            keywords: [importe impagado, deuda vencida, impago]
