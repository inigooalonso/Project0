# Preguntas de ejemplo y respuestas GUIONIZADAS del agente simulado.
#
# Cada escenario fija lo que el LLM devolvería en los pasos 1, 5 y 6:
#   semantic_ir:   salida del parser (se valida con Pydantic_SemanticQueryIR)
#   clarification: pregunta de aclaración (opcional) y respuestas rápidas
#   sql / sql_variants: SQL en dialecto Athena (una variante por respuesta)
#   assumptions:   supuestos del SQLDraft
#   explanation:   cómo se ha calculado, en lenguaje llano
# Los pasos 2, 3, 4 y 7 no están guionizados: los calculan los servicios
# simulados (RAG, joins, glosario y DuckDB) a partir de este IR.

scenarios:
  - id: hipotecas_oficina
    label: Hipotecas por oficina
    icon: ":material/home:"
    question: ¿Qué 10 oficinas concedieron más importe en hipotecas durante 2025?
    aliases:
      - oficinas con más hipotecas en 2025
      - top 10 oficinas por importe de hipotecas concedidas en 2025
    semantic_ir:
      intent: ranking
      metrics:
        - id: m1
          surface_form: importe en hipotecas
          entity: préstamo hipotecario
          concept: importe concedido
          aggregation: sum
      dimensions:
        - id: d1
          surface_form: oficinas
          entity: oficina
          concept: oficina
          related_metric_ids: [m1]
      attributes:
        - id: a1
          surface_form: oficinas
          entity: oficina
          concept: nombre de la oficina
          related_dimension_ids: [d1]
      result_grain: [d1]
      filters:
        - id: f1
          surface_form: hipotecas
          entity: préstamo
          concept: producto de préstamo
          operator: eq
          value: hipoteca
      time_range:
        id: t1
        surface_form: durante 2025
        entity: préstamo hipotecario
        concept: fecha de formalización
        type: absolute
        start: 2025-01-01
        end: 2025-12-31
        applies_to_metric_ids: [m1]
      order_by:
        - target_id: m1
          direction: desc
      limit: 10
      unresolved_concepts: []
      ambiguities: []
    sql: |
      SELECT
          b.gf_branch_name AS oficina,
          b.gf_region_name AS direccion_territorial,
          COUNT(*) AS num_hipotecas,
          SUM(l.gf_granted_amount) AS importe_concedido_eur,
          ROUND(100.0 * SUM(l.gf_granted_amount) / SUM(SUM(l.gf_granted_amount)) OVER (), 2) AS pct_sobre_la_red
      FROM ho_master.t_prsg_loans AS l
      INNER JOIN ho_master.t_pred_branches AS b
          ON l.gf_branch_id = b.gf_branch_id
      WHERE l.gf_loan_product_desc = 'Hipoteca vivienda'
        AND l.gf_formalization_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
      GROUP BY b.gf_branch_id, b.gf_branch_name, b.gf_region_name
      ORDER BY importe_concedido_eur DESC
      LIMIT 10;
    assumptions:
      - «Hipotecas» se interpreta como el producto «Hipoteca vivienda».
      - El importe es el principal concedido en la firma (gf_granted_amount).
      - El porcentaje se calcula sobre el total de hipotecas de toda la red en 2025.
    explanation: >-
      He sumado el importe concedido de todas las hipotecas de vivienda firmadas
      entre el 1 de enero y el 31 de diciembre de 2025, lo he agrupado por la
      oficina que las formalizó y me he quedado con las 10 de mayor importe.
      También calculo qué parte del total de la red representa cada una.

  - id: saldo_vista
    label: Saldo a la vista
    icon: ":material/trending_up:"
    question: ¿Cómo ha evolucionado mes a mes el saldo de las cuentas a la vista de particulares entre octubre de 2025 y septiembre de 2026?
    aliases:
      - evolución mensual del saldo de cuentas a la vista de particulares
      - saldo de cuentas a la vista de particulares en los últimos 12 meses
    semantic_ir:
      intent: trend_analysis
      metrics:
        - id: m1
          surface_form: saldo de las cuentas
          entity: cuenta a la vista
          concept: saldo a fin de mes
          aggregation: sum
      dimensions:
        - id: d1
          surface_form: mes a mes
          entity: saldo de cuenta
          concept: mes de corte
          grain: month
          related_metric_ids: [m1]
      attributes: []
      result_grain: [d1]
      filters:
        - id: f1
          surface_form: cuentas a la vista
          entity: cuenta
          concept: tipo de producto de cuenta
          operator: eq
          value: cuenta a la vista
        - id: f2
          surface_form: particulares
          entity: cliente
          concept: segmento de cliente
          operator: eq
          value: particulares
      time_range:
        id: t1
        surface_form: entre octubre de 2025 y septiembre de 2026
        entity: saldo de cuenta
        concept: fecha de corte
        type: absolute
        start: 2025-10-01
        end: 2026-09-30
        applies_to_metric_ids: [m1]
      order_by:
        - target_id: d1
          direction: asc
      limit: null
      unresolved_concepts: []
      ambiguities: []
    sql: |
      SELECT
          s.gf_cutoff_date AS mes,
          SUM(s.gf_end_month_balance_amount) AS saldo_total_eur,
          COUNT(DISTINCT s.gf_account_id) AS num_cuentas
      FROM ho_master.t_pcta_account_balances_monthly AS s
      INNER JOIN ho_master.t_pcta_accounts AS a
          ON s.gf_account_id = a.gf_account_id
      INNER JOIN ho_master.t_pcli_customers AS c
          ON a.gf_customer_id = c.gf_customer_id
      WHERE a.gf_product_type_desc = 'Cuenta a la vista'
        AND c.gf_customer_segment_desc = 'Particulares'
        AND s.gf_cutoff_date BETWEEN DATE '2025-10-01' AND DATE '2026-09-30'
      GROUP BY s.gf_cutoff_date
      ORDER BY s.gf_cutoff_date;
    assumptions:
      - Se usa el saldo al cierre de cada mes (fecha de corte = último día del mes).
      - «Particulares» es el segmento comercial Particulares; no incluye Banca Personal.
    explanation: >-
      He sumado, para cada cierre de mes entre octubre de 2025 y septiembre de
      2026, el saldo de todas las cuentas a la vista cuyo titular es un cliente
      del segmento Particulares.

  - id: gasto_tarjeta
    label: Gasto con tarjeta
    icon: ":material/credit_card:"
    question: ¿En qué categorías de comercio gastaron más nuestros clientes con tarjeta de crédito en el tercer trimestre de 2026?
    aliases:
      - gasto con tarjeta de crédito por categoría de comercio
      - categorías de comercio con más gasto con tarjeta de crédito en el tercer trimestre
    semantic_ir:
      intent: distribution
      metrics:
        - id: m1
          surface_form: gastaron
          entity: compra con tarjeta
          concept: importe de la compra
          aggregation: sum
      dimensions:
        - id: d1
          surface_form: categorías de comercio
          entity: comercio
          concept: categoría de comercio
          related_metric_ids: [m1]
      attributes: []
      result_grain: [d1]
      filters:
        - id: f1
          surface_form: tarjeta de crédito
          entity: tarjeta
          concept: tipo de tarjeta
          operator: eq
          value: crédito
      time_range:
        id: t1
        surface_form: en el tercer trimestre de 2026
        entity: compra con tarjeta
        concept: fecha de la operación
        type: absolute
        start: 2026-07-01
        end: 2026-09-30
        applies_to_metric_ids: [m1]
      order_by:
        - target_id: m1
          direction: desc
      limit: null
      unresolved_concepts: []
      ambiguities: []
    sql: |
      SELECT
          t.gf_merchant_category_desc AS categoria_de_comercio,
          SUM(t.gf_txn_amount) AS gasto_total_eur,
          COUNT(*) AS num_compras,
          ROUND(100.0 * SUM(t.gf_txn_amount) / SUM(SUM(t.gf_txn_amount)) OVER (), 1) AS pct_del_gasto
      FROM ho_master.t_pmpg_card_transactions AS t
      INNER JOIN ho_master.t_pmpg_cards AS c
          ON t.gf_card_id = c.gf_card_id
      WHERE c.gf_card_type_desc = 'Crédito'
        AND t.gf_operation_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30'
      GROUP BY t.gf_merchant_category_desc
      ORDER BY gasto_total_eur DESC;
    assumptions:
      - El gasto es la suma del importe de las compras en comercios; no incluye retiradas de efectivo.
      - Tercer trimestre de 2026 = del 1 de julio al 30 de septiembre.
    explanation: >-
      He sumado el importe de todas las compras hechas con tarjetas de crédito
      entre el 1 de julio y el 30 de septiembre de 2026, agrupadas por la
      categoría del comercio, y calculo qué parte del gasto total supone cada una.

  - id: morosidad_oficinas
    label: Morosidad por oficina
    icon: ":material/warning:"
    question: ¿Qué oficinas tienen peor morosidad?
    aliases:
      - oficinas con más morosidad
      - ranking de oficinas por morosidad
    semantic_ir:
      intent: ranking
      metrics:
        - id: m1
          surface_form: peor morosidad
          entity: préstamo
          concept: morosidad
          aggregation: null
      dimensions:
        - id: d1
          surface_form: oficinas
          entity: oficina
          concept: oficina
          related_metric_ids: [m1]
      attributes:
        - id: a1
          surface_form: oficinas
          entity: oficina
          concept: nombre de la oficina
          related_dimension_ids: [d1]
      result_grain: [d1]
      filters: []
      time_range: null
      order_by:
        - target_id: m1
          direction: desc
      limit: null
      unresolved_concepts:
        - morosidad
      ambiguities:
        - «Peor morosidad» no indica cómo se mide la morosidad.
        - No se indica la fecha de referencia.
    clarification:
      question: >-
        En el glosario hay dos formas de medir la morosidad: la tasa de mora
        (saldo con más de 90 días de impago sobre el saldo vivo) y el ratio de
        impagados (porcentaje de préstamos con alguna cuota impagada). ¿Cuál
        quieres usar para ordenar las oficinas?
      options:
        - value: tasa_mora
          label: Tasa de mora (> 90 días)
          keywords: [mora, tasa, 90, regulatoria, npl, dudoso, saldo]
        - value: impagados
          label: Ratio de impagados
          keywords: [impagados, impago, impagadas, cuotas, recibos, ratio, porcentaje de préstamos]
    sql_variants:
      tasa_mora: |
        SELECT
            b.gf_branch_name AS oficina,
            b.gf_region_name AS direccion_territorial,
            SUM(d.gf_outstanding_amount) AS saldo_vivo_eur,
            SUM(CASE WHEN d.gf_days_past_due_number > 90 THEN d.gf_outstanding_amount ELSE 0 END) AS saldo_moroso_eur,
            ROUND(100.0 * SUM(CASE WHEN d.gf_days_past_due_number > 90 THEN d.gf_outstanding_amount ELSE 0 END)
                  / SUM(d.gf_outstanding_amount), 2) AS tasa_de_mora_pct
        FROM ho_master.t_prsg_loan_delinquency AS d
        INNER JOIN ho_master.t_prsg_loans AS l
            ON d.gf_loan_id = l.gf_loan_id
        INNER JOIN ho_master.t_pred_branches AS b
            ON l.gf_branch_id = b.gf_branch_id
        WHERE d.gf_cutoff_date = DATE '2026-09-30'
        GROUP BY b.gf_branch_id, b.gf_branch_name, b.gf_region_name
        ORDER BY tasa_de_mora_pct DESC
        LIMIT 10;
      impagados: |
        SELECT
            b.gf_branch_name AS oficina,
            b.gf_region_name AS direccion_territorial,
            COUNT(*) AS num_prestamos,
            SUM(CASE WHEN d.gf_unpaid_installments_number > 0 THEN 1 ELSE 0 END) AS prestamos_con_impago,
            ROUND(100.0 * SUM(CASE WHEN d.gf_unpaid_installments_number > 0 THEN 1 ELSE 0 END)
                  / COUNT(*), 2) AS ratio_de_impagados_pct
        FROM ho_master.t_prsg_loan_delinquency AS d
        INNER JOIN ho_master.t_prsg_loans AS l
            ON d.gf_loan_id = l.gf_loan_id
        INNER JOIN ho_master.t_pred_branches AS b
            ON l.gf_branch_id = b.gf_branch_id
        WHERE d.gf_cutoff_date = DATE '2026-09-30'
        GROUP BY b.gf_branch_id, b.gf_branch_name, b.gf_region_name
        ORDER BY ratio_de_impagados_pct DESC
        LIMIT 10;
    assumptions_variants:
      tasa_mora:
        - Morosidad = tasa de mora, saldo vivo con más de 90 días de impago sobre el saldo vivo total.
        - Fecha de referencia = último cierre disponible (30/09/2026).
        - Se muestran las 10 oficinas con la tasa más alta.
        - El préstamo enlaza la situación de impago con su oficina formalizadora.
      impagados:
        - Morosidad = ratio de impagados, préstamos con al menos una cuota impagada sobre el total.
        - Fecha de referencia = último cierre disponible (30/09/2026).
        - Se muestran las 10 oficinas con el ratio más alto.
        - El préstamo enlaza la situación de impago con su oficina formalizadora.
    explanation_variants:
      tasa_mora: >-
        Con la definición regulatoria: para cada oficina he sumado el saldo vivo
        de sus préstamos a 30/09/2026 y la parte de ese saldo con más de 90 días
        de impago. La tasa de mora es el cociente; muestro las 10 oficinas con
        la tasa más alta.
      impagados: >-
        Con la definición de alerta temprana: para cada oficina he contado sus
        préstamos vivos a 30/09/2026 y cuántos tienen al menos una cuota
        impagada. El ratio es el cociente; muestro las 10 oficinas con el ratio
        más alto.
