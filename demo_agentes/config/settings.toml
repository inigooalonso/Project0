# Configuración de la demo. Los valores entre paréntesis se pueden
# sobrescribir con una variable de entorno.

[agent]
# Módulo con tus nodos (parse_semantic_query, inject_query_context,
# invoke_pydantic, generate_sql).                                     (ADA_AGENT_MODULE)
module = "agents.ada_text2sql.agent"
# Paso 5 · Aclaraciones:                                               (ADA_CLARIFICATION_MODE)
#   "node"  = tu nodo decide_if_clarification_is_needed tal cual (una pregunta por ronda);
#   "batch" = el agente hace todas sus preguntas a la vez (prompt del adaptador).
clarification_mode = "node"
# Rondas de aclaración como máximo (además del límite que ponga tu nodo).
max_clarification_rounds = 3
# Solo en modo "batch": preguntas por ronda como máximo.
max_questions_per_round = 5

[sql]
# Dialecto que se fuerza en el contexto enviado al LLM.
dialect = "AWS Athena (Trino SQL)"
# Dialecto de lectura para sqlglot (validación de la SQL).
sqlglot_dialect = "athena"
database = "ho_master"
workgroup = "sandbox"
# Filas máximas que se muestran en pantalla.
max_rows = 500

[timeouts]
# Segundos máximos de espera a cada servicio antes de mostrar el error.
llm = 60
rag = 30
executor = 120

[demo]
# true = el pipeline avanza solo; false = modo presentador (botón «Siguiente paso»). (ADA_AUTOPLAY)
autoplay = true

[business]
# Agente Business Understanding: tu agentic RAG (agents/business_understanding).
# Carpeta de Qdrant en modo local, relativa a demo_agentes/.            (RAG_QDRANT_PATH)
qdrant_path = "agentic_rag_qdrant_db"
collection = "rag_md"                                                  # (RAG_COLLECTION)
# Modelo de Bedrock; vacío = el LLM_MODEL de rag_common.py.              (RAG_MODEL)
model = ""
# Pasos máximos del bucle del agente (max_steps de AgenticRAG).
max_steps = 10
# Incluir el catálogo de temas y documentos en el prompt del sistema.
catalog_in_prompt = true
