# Configuración de la demo. Los valores entre paréntesis se pueden
# sobrescribir con una variable de entorno.

[agent]
# Módulo con tus nodos (parse_semantic_query, inject_query_context,
# invoke_pydantic, generate_sql).                                     (ADA_AGENT_MODULE)
module = "agents.ada_text2sql.agent"
# Rondas de aclaración como máximo. En cada ronda el agente puede hacer
# varias preguntas a la vez.
max_clarification_rounds = 3
max_questions_per_round = 5

[sql]
# Dialecto que se fuerza en el contexto enviado al LLM.
dialect = "AWS Athena (Trino SQL)"
# Dialecto de lectura para sqlglot (validación de la SQL).
sqlglot_dialect = "athena"
database = "ho_master"
workgroup = "sandbox"
# Filas máximas que se muestran en pantalla.
max_rows = 500

[timeouts]
# Segundos máximos de espera a cada servicio antes de mostrar el error.
llm = 60
rag = 30
executor = 120

[demo]
# true = el pipeline avanza solo; false = modo presentador (botón «Siguiente paso»). (ADA_AUTOPLAY)
autoplay = true
